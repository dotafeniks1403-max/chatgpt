<!doctype html><html lang="sr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Učimo boje</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ee;color:#263755;font-family:system-ui,sans-serif;text-align:center}main{max-width:680px;margin:auto;padding:18px 20px 30px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.logo{font-weight:850;font-size:20px}button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #263755;outline-offset:4px}.small{background:#fff;border:2px solid #e9e4dc;border-radius:18px;padding:12px;font-size:21px;min-width:50px}.eyebrow{color:#695c80;font-size:15px;font-weight:700}h1{font-size:clamp(28px,7vw,42px);line-height:1.12;margin:12px 0}p{font-size:18px;line-height:1.45}.mascot{font-size:80px;margin:24px 0 12px;animation:bob 3s infinite}.primary{background:#6652d9;color:#fff;border-radius:24px;padding:19px 28px;font-weight:800;font-size:24px;box-shadow:0 6px 0 #4937aa;min-height:66px;margin:16px auto;display:block}.progress{display:flex;justify-content:center;gap:7px;margin:20px 0}.dot{height:13px;width:13px;border-radius:50%;background:#ded8cf}.dot.done{background:#e6ad24}.dot.now{background:#6652d9}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin:24px auto;max-width:470px}.tile{height:clamp(105px,20vh,165px);border-radius:30px;background:white;border:2px solid #e9e4dc;box-shadow:0 5px 0 #e8e0d4;display:grid;place-items:center}.tile:active{transform:scale(.96)}.ball{display:block;width:78%;max-width:132px;aspect-ratio:1;border-radius:50%;background:var(--c);border:2px solid #0002;box-shadow:inset -8px -9px 0 #00000012;position:relative}.ball:before{content:'';position:absolute;left:22%;top:17%;width:24%;height:12%;border-radius:50%;background:#ffffff65;transform:rotate(-35deg)}.feedback{min-height:30px;font-size:20px;font-weight:700}.examples{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.example{background:white;border:2px solid #eee5d7;border-radius:22px;padding:13px 7px;font-size:17px;font-weight:650}.emoji{display:block;font-size:42px;margin-bottom:6px}.swatch{display:inline-block;width:24px;height:24px;border:1px solid #999;border-radius:50%;vertical-align:middle;margin-right:8px}.stars{font-size:48px;color:#e9ac1d;margin:26px 0;letter-spacing:5px;animation:bob 2s infinite}.note{font-size:14px;color:#746779}.confetti{pointer-events:none;position:fixed;top:-30px;animation:fall 2.8s ease-in forwards;font-size:24px;z-index:4}.shake{animation:shake .3s}.hidden{display:none}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes fall{to{transform:translateY(110vh) rotate(380deg)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-height:650px){main{padding-top:10px}header{margin-bottom:10px}.choices{gap:12px;margin:15px auto}.tile{height:105px}.ball{height:82px;width:82px}.examples{margin:10px 0}.emoji{font-size:32px}.primary{margin:10px auto;padding:15px}h1{margin:8px 0}}
</style><main><header><span class="logo">🌈 Učimo boje</span><button class="small" id="sound" aria-label="Ponovi glasovno uputstvo">🔊</button></header><div id="app"></div><p id="voiceNotice" class="note"></p></main><script>
const colors=[
['crvena','crvenu','#ec3548','🍓|Jagoda','🍒|Trešnje','🍅|Paradajz','🌶️|Crvena paprika','🌹|Crvena ruža','🍎|Crvena jabuka'],
['plava','plavu','#2282e5','🌌|Vedro dnevno nebo','👖|Plave farmerke','📘|Plava knjiga','🚙|Plavi automobil','🧢|Plava kapa','🫐|Borovnice'],
['žuta','žutu','#f7cf28','🍌|Banana','🍋|Limun','🌻|Latice suncokreta','⭐|Žuta zvezdica','🌽|Kukuruz','🐥|Žuto pile'],
['zelena','zelenu','#36aa59','🥒|Krastavac','🥦|Brokoli','🥬|Zelena salata','🍃|Zeleni list','🫑|Zelena paprika','🍏|Zelena jabuka'],
['narandžasta','narandžastu','#f28b24','🍊|Pomorandža','🥕|Šargarepa','🎃|Narandžasta bundeva','🏀|Košarkaška lopta','🦊|Lisičje krzno','📙|Narandžasta knjiga'],
['ljubičasta','ljubičastu','#874dc5','🍆|Patlidžan','🍇|Ljubičasto grožđe','🪻|Zumbul','☂️|Ljubičasti kišobran','🟣|Ljubičasta lopta','👕|Ljubičasta majica'],
['roze','roze','#ed82b0','🌸|Ružičasti cvet','🦩|Flamingo','🐷|Prase','🎀|Roze mašna','👗|Roze haljina','🎈|Roze balon'],
['braon','braon','#94592f','🍫|Čokolada','🪵|Drvo','🌰|Kesten','🥔|Kora krompira','🧸|Braon meda','🥝|Kora kivija'],
['bela','belu','#ffffff','🥛|Mleko','❄️|Sneg','☁️|Beli oblak','🦢|Beli labud','🥚|Belo jaje','📄|Beli papir'],
['crna','crnu','#25272c','🐈‍⬛|Crna mačka','🐦‍⬛|Gavran','🛞|Automobilska guma','🎹|Crna dirka','🎩|Crni šešir','🖊️|Crno mastilo']];
let audioPlayer=null;let order=[],step=0,attempts=0,firsts=0,roundTries=0,phase='home',last='',locked=false,reminder=null;const app=document.querySelector('#app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stop(){if(audioPlayer){audioPlayer.pause();audioPlayer=null;}clearTimeout(reminder);if(window.speechSynthesis)speechSynthesis.cancel()}
function speechKey(t){let h=5381;for(let i=0;i<t.length;i++)h=(Math.imul(h,33)^t.charCodeAt(i))>>>0;return 'v'+h}
function speak(t){last=t;stop();audioPlayer=new Audio('audio/'+speechKey(t)+'.mp3');audioPlayer.play().catch(()=>voiceUnavailable());}
function voiceUnavailable(){document.querySelector('#voiceNotice').textContent='Zvuk nije pokrenut. Pritisni zvučnik da probaš ponovo.'}
function progress(){return '<div class="progress" aria-label="Rešeno '+step+' od 10">'+order.map((_,i)=>'<span class="dot '+(i<step?'done':i===step?'now':'')+'"></span>').join('')+'</div>'}
function party(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<26;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['⭐','✨','🟣','🟡'][i%4];e.style.left=Math.random()*98+'%';e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),3600)}}
function home(){stop();phase='home';app.innerHTML='<div class="mascot">🌈</div><h1>Hajde da pronađemo boje!</h1><p>Dodirni boju koju čuješ.<br>Za svaku osvojenu boju — zvezdica!</p><button class="primary" id="start">▶ Igraj</button><p class="note">10 boja · veliki oblici · bez žurbe</p>';document.querySelector('#start').onclick=start;last='Hajde da učimo boje! Pritisni veliko dugme Igraj.'}
function start(){stop();order=shuffle(colors.map((_,i)=>i));step=attempts=firsts=0;question()}
function question(){phase='question';locked=false;roundTries=0;let idx=order[step],c=colors[idx];let options=shuffle([idx,...shuffle(colors.map((_,i)=>i).filter(i=>i!==idx)).slice(0,3)]);app.innerHTML=progress()+'<div class="eyebrow">BOJA '+(step+1)+' OD 10</div><h1>Pronađi '+c[1]+' boju</h1><div class="choices">'+options.map(i=>'<button class="tile" data-color="'+i+'" aria-label="'+colors[i][0]+' boja"><span class="ball" style="--c:'+colors[i][2]+'"></span></button>').join('')+'</div><div class="feedback" aria-live="polite">Dodirni jedan krug 👆</div>';document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>answer(Number(b.dataset.color),b));speak('Pronađi '+c[1]+' boju. Dodirni krug.');}
function answer(i,b){if(locked||phase!=='question')return;attempts++;roundTries++;if(i!==order[step]){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');document.querySelector('.feedback').textContent='Probaj ponovo. Možeš ti to!';speak('Probaj ponovo. Pronađi '+colors[order[step]][1]+' boju.');return}locked=true;if(roundTries===1)firsts++;examples();party()}
function examples(){phase='examples';const c=colors[order[step]];app.innerHTML=progress()+'<div class="eyebrow">⭐ BRAVO!</div><h1><span class="swatch" style="background:'+c[2]+'"></span>To je '+c[0]+'!</h1><p>Gde sve vidimo ovu boju?</p><div class="examples">'+c.slice(3).map((s,i)=>{let [e,n]=s.split('|');let custom=/Ljubičasta lopta|Ljubičasta majica|Roze haljina|Roze balon/.test(n);return '<div class="example"><span class="emoji">'+(custom?shape(n,c[2]):e)+'</span>'+n+'</div>'}).join('')+'</div><button class="primary" id="next">'+(step===9?'Moje zvezdice ⭐':'Sledeća boja ➜')+'</button>';document.querySelector('#next').onclick=()=>{stop();step++;step===10?finish():question()};speak('Bravo! To je '+c[0]+' boja. Evo šest primera: '+c.slice(3).map(s=>s.split('|')[1]).join('. ')+'. '+(step===9?'Pritisni veliko ljubičasto dugme Moje zvezdice.':'Pritisni veliko ljubičasto dugme Sledeća boja.'));}
function shape(n,col){let path=n.includes('majica')?'M12 4L3 10 8 18 13 15 13 36 31 36 31 15 36 18 41 10 32 4 28 8 16 8Z':n.includes('haljina')?'M16 3L28 3 31 13 27 17 38 39 6 39 17 17 13 13Z':null;return '<svg width="46" height="46" viewBox="0 0 44 44" aria-hidden="true">'+(path?'<path fill="'+col+'" d="'+path+'"/>':'<ellipse fill="'+col+'" cx="22" cy="20" rx="16" ry="18"/>')+'</svg>'}
function finish(){phase='finish';app.innerHTML='<div class="mascot">🏆</div><h1>Bravo, majstore!</h1><p>Pronašao si svih 10 boja!</p><div class="stars">★★★★★<br>★★★★★</div><p>'+attempts+' pokušaja · '+firsts+' boja iz prve</p><button class="primary" id="again">Igraj ponovo ↻</button>';document.querySelector('#again').onclick=start;speak(firsts===10?'Svaka čast, majstore! Sve boje si pogodio iz prve! Osvojio si deset zvezdica. Za novu igru pritisni Igraj ponovo.':'Bravo! Pronašao si svih deset boja! Osvojio si deset zvezdica! Za novu igru pritisni Igraj ponovo.');party()}
document.querySelector('#sound').onclick=()=>speak(last);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});home();
</script></html>
